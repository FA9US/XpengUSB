name: XpengUSB checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: for script in install.sh install-dashboard.sh scripts/gadget.sh; do bash -n "$script"; done
      - run: shellcheck install.sh install-dashboard.sh scripts/gadget.sh
  linux-storage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y btrfs-progs dosfstools fdisk util-linux udev cifs-utils samba
      - run: sudo python3 tests/linux_storage_smoke.py --disposable-test
  home-assistant:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'homeassistant==2025.1.4'
      - run: |
          python -c 'from custom_components.xpengusb import config_flow, sensor, binary_sensor, button, switch; assert config_flow.ConfigFlow.VERSION == 1; assert "nas_destination" in sensor.SENSORS'
